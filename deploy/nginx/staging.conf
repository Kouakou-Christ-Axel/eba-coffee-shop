# nginx : staging.eba-coffee.com  (modèle, à adapter à la config existante)
#
# 1) Upstream — écrit et rechargé par deploy/deploy.sh (ne pas éditer à la main) :
#    /etc/nginx/conf.d/eba-staging-upstream.conf
#        upstream eba_staging { server 127.0.0.1:2001; }
#
# 2) Dans le server { } de staging, remplacer le `proxy_pass http://127.0.0.1:2001`
#    en dur par les blocs ci-dessous.

add_header X-Robots-Tag "noindex, nofollow" always;

# Sonde de santé de la CI : hors authentification basique.
location = /api/health {
    auth_basic off;
    proxy_pass http://eba_staging;
}

# Assets versionnés : dossier cumulatif alimenté à chaque déploiement, pour que
# les pages ouvertes avant une bascule retrouvent leurs anciens chunks.
location /_next/static/ {
    alias /var/lib/eba/staging/next-static/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri @app;
}

location @app {
    proxy_pass http://eba_staging;
}

location / {
    auth_basic "Staging EBA";
    auth_basic_user_file /etc/nginx/.htpasswd-eba-staging;

    proxy_pass http://eba_staging;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Flux SSE (/api/preparation/stream, /api/caisse/stream) : pas de tampon.
    proxy_buffering off;
    proxy_read_timeout 1h;
}
